name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install packages
        run: bun install --frozen-lockfile && bun install --frozen-lockfile --cwd cli
      - name: Type-check the program
        run: bunx tsc --noEmit -p cli
      - name: Test the program
        run: bun test --cwd cli
      - name: Test the mod against the program
        run: bun test
      - name: Build the program
        run: bun run --cwd cli build
